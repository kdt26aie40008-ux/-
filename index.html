<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Frost Peak Climber</title>
<style>
html,body{margin:0;height:100%;background:#111;display:flex;align-items:center;justify-content:center}
canvas{width:min(96vw,96vh);height:min(96vw,96vh);border:4px solid #fff}
</style>
</head>
<body>
<canvas id="c" width="480" height="480"></canvas>
<script>
const C=document.getElementById('c'),S=2;let X=C.getContext('2d');
C.width=C.height=480*S;
const T=32,W=15,VW=480,VH=480;
const keys={},pressed={};
addEventListener('keydown',e=>{
  if(['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();
  if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;
  // 隠しコマンド: ↑↑↓↓→←→← で10秒間無敵 / ↑→←↓ で10秒間ハンマー強化
  // コマンドは WASD でも打てる (W=↑ A=← S=↓ D=→)
  if(!e.repeat){cmd=(cmd+(WASD[e.code]||e.code)+',').split(',').slice(-12).join(',');
    // 難易度設定: →↓←↑→↓←↑ で難易度3 (もう一度打つと元に戻る)。タイトルでもゲーム中でもOK
    if(cmd.endsWith(CMD_HARD)){hard=!hard;hardCyc=0;cmd='';if(!hard&&P){P.star=0;P.curse=0}}
    else if(state=='play'){
      if(cmd.endsWith(CHEAT_STAR)){P.star=600;P.cheat=1;cmd=''}
      else if(cmd.endsWith(CHEAT_POW)){P.pow=600;cmd=''}
      else if(cmd.endsWith(CHEAT_HIDE)&&P.hide<=0){P.stash=en;en=[];P.hide=600;cmd=''}
    }}
});
const CHEAT_STAR='ArrowUp,ArrowUp,ArrowDown,ArrowDown,ArrowRight,ArrowLeft,ArrowRight,ArrowLeft,';
const CHEAT_POW='ArrowUp,ArrowRight,ArrowLeft,ArrowDown,';
const CHEAT_HIDE='ArrowUp,ArrowDown,ArrowRight,ArrowRight,ArrowLeft,ArrowLeft,ArrowUp,ArrowDown,ArrowDown,ArrowLeft,ArrowRight,';
const CMD_HARD='ArrowRight,ArrowDown,ArrowLeft,ArrowUp,ArrowRight,ArrowDown,ArrowLeft,ArrowUp,';
const WASD={KeyW:'ArrowUp',KeyA:'ArrowLeft',KeyS:'ArrowDown',KeyD:'ArrowRight'};
let cmd='',hard=false,hardCyc=0,autoCam=0;
addEventListener('keyup',e=>{keys[e.code]=0});
// タイトル画面の「難易度コマンド」ボタン
const BTN={x:VW/2-90,y:444,w:180,h:28};let showCmd=false;
const canvasPos=e=>{const b=C.getBoundingClientRect();return{x:(e.clientX-b.left-C.clientLeft)/C.clientWidth*VW,y:(e.clientY-b.top-C.clientTop)/C.clientHeight*VH}};
const onBtn=q=>q.x>=BTN.x&&q.x<=BTN.x+BTN.w&&q.y>=BTN.y&&q.y<=BTN.y+BTN.h;
C.addEventListener('click',e=>{if(state!='title')return;if(showCmd)showCmd=false;else if(onBtn(canvasPos(e)))showCmd=true});
C.addEventListener('mousemove',e=>{C.style.cursor=state=='title'&&(showCmd||onBtn(canvasPos(e)))?'pointer':'default'});

// f:階層数 e:敵の出現率 s:敵の速度
// f:階層数 e:敵の出現率 s:敵の速度 cl:雲の階数
const STG=[{f:7,e:.35,s:.8,cl:0},{f:9,e:.6,s:1.1,cl:1},{f:11,e:.85,s:1.4,cl:2}];
const ECOL=[['#ffffff','#e4ecff','#8a98c8'],['#f4e0ff','#c890ff','#6a38a8'],['#ffe0c0','#ffa060','#a85018']],WT=W*T;
let state='title',stage=0,score=0,lives=3,map,H,P,en,parts,cam,timer=0,frame=0,flakes=[],items,clouds,cond,best;
const wrap=x=>(x%WT+WT)%WT,wdx=(a,b)=>wrap(a-b+WT/2)-WT/2;
let seed=1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<50;i++)flakes.push({x:Math.random()*VW,y:Math.random()*VH,s:.5+Math.random()});

function build(){
  const s=STG[stage];seed=stage*999+7;
  H=4*s.f+5;map=[];en=[];parts=[];items=[];clouds=[];
  for(let r=0;r<H;r++)map.push(new Array(W).fill(0));
  map[H-1].fill(1);
  for(let k=0;k<s.f;k++){
    const r=4+4*k;
    // 頂上直下の階は動く雲だけ
    if(k>=1&&k<=s.cl){clouds.push({x:rnd()*WT,y:r*T,w:3*T,vx:(k%2?1:-1)*(.8+stage*.3)});continue}
    map[r].fill(2);
    const segs=1+(rnd()*2|0);
    for(let i=0;i<segs;i++){const c0=rnd()*13|0,L=2+(rnd()*3|0);for(let c=c0;c<Math.min(W,c0+L);c++)map[r][c]=1}
    if(k>0&&rnd()<.3){const c0=rnd()*13|0;map[r][c0]=map[r][c0+1]=0}
    if(k>0&&rnd()<.4)items.push({x:(rnd()*W|0)*T+8,y:r*T-20,w:16,h:20,t:pickItem()});
  }
  for(let k=1;k<=s.f;k++){
    const r=4+4*k;let n=(rnd()<s.e)+(rnd()<s.e-.4);
    for(let i=0;i<n;i++){
      let c=rnd()*W|0;if(k==s.f)c=Math.max(c,8);
      if(!map[r][c])continue;
      en.push({x:c*T+4,y:r*T-22,w:24,h:22,vx:0,vy:0,dir:rnd()<.5?-1:1,onG:1,cd:0});
    }
  }
  // 空を飛ぶ鳥
  for(let i=0;i<=stage;i++)en.push({fly:1,x:rnd()*WT,by:(10+rnd()*(H-20))*T,y:0,w:24,h:16,dir:rnd()<.5?-1:1,t:rnd()*6});
  cond={x:0,y:30,w:44,h:22,dir:1};
  P={x:2*T+6,y:(H-1)*T-30,w:20,h:30,vx:0,vy:0,dir:1,onG:1,atk:0,inv:0,jc:0,jt:0,jbuf:0,jlock:0,pow:0,star:0,grip:0,cheat:0,curse:0,hide:0,stash:[],dbl:0,hurtT:0};
  best=H-1;cam=autoCam=H*T-VH;
}
// アイテムの種類 (マップ生成の乱数とは別にする)
// nasu:得点 heart:体力回復 pow:攻撃力アップ star:無敵 grip:滑らない
function pickItem(){const v=Math.random();return v<.35?'nasu':v<.52?'heart':v<.69?'pow':v<.84?'star':'grip'}
function getItem(t){
  if(t=='nasu')score+=300;
  else if(t=='heart')lives=Math.min(5,lives+1);
  else if(t=='pow')P.pow=600;
  else if(t=='star')P.star=480;
  else if(t=='grip')P.grip=600;
  if(t!='nasu')score+=100;
}
function reset(){stage=0;score=0;lives=3;build();state='play'}

function solid(c,r){if(r>=H)return 1;if(r<0)return 0;return map[r][(c%W+W)%W]}
function breakTile(c,r){
  c=(c%W+W)%W;map[r][c]=0;score+=10;
  for(let i=0;i<8;i++)parts.push({x:c*T+16,y:r*T+16,vx:(Math.random()-.5)*6,vy:-Math.random()*5,l:40,c:i%2?'#a8f0ff':'#fff'});
}
function moveEnt(o,isP){
  let hit=0;o.x+=o.vx;
  const r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-1)/T);
  if(o.vx>0){const c=Math.floor((o.x+o.w-1)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){o.x=c*T-o.w;hit=1;break}}
  else if(o.vx<0){const c=Math.floor(o.x/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){o.x=(c+1)*T;hit=1;break}}
  o.vy=Math.min(o.vy+(isP?.9:.5),isP?14:10);o.y+=o.vy;o.onG=0;
  const c0=Math.floor(o.x/T),c1=Math.floor((o.x+o.w-1)/T);
  if(o.vy>0){
    const r=Math.floor((o.y+o.h-1)/T);
    for(let c=c0;c<=c1;c++)if(solid(c,r)){o.y=r*T-o.h;o.vy=0;o.onG=1;break}
  }else if(o.vy<0){
    const r=Math.floor(o.y/T),b0=solid(c0,r),b1=solid(c1,r);
    if(b0||b1){
      // 角に少しだけ当たった場合は穴の方へずらす
      if(isP&&b0&&!b1&&(c0+1)*T-o.x<=10)o.x=(c0+1)*T;
      else if(isP&&b1&&!b0&&o.x+o.w-c1*T<=10)o.x=c1*T-o.w;
      else{
        if(isP)for(let c=c0;c<=c1;c++)if(solid(c,r)==2)breakTile(c,r);
        o.y=(r+1)*T;o.vy=1;
      }
    }
  }
  o.x=wrap(o.x);
  return hit;
}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function update(){
  frame++;
  if(state!='play'){
    if(state=='clear'){if(--timer<=0){stage++;if(stage>=STG.length)state='win';else{build();state='play'}}}
    else if(showCmd){if(pressed.Enter||pressed.Space||pressed.Escape)showCmd=false}
    else if(pressed.Enter||pressed.Space)reset();
    return;
  }
  const ax=(keys.KeyA||keys.ArrowLeft?-1:0)+(keys.KeyD||keys.ArrowRight?1:0);
  const onIce=P.grip<=0&&P.onG&&solid(Math.floor((P.x+P.w/2)/T),Math.floor((P.y+P.h)/T))==2;
  // 空中では向きも速度も変えられない
  if(P.onG){
    if(onIce){
      // 氷の上: 加速も減速も鈍く、止まれずに向いている方へ滑り続ける
      P.vx+=ax?ax*.08:0;P.vx=Math.max(-3.2,Math.min(3.2,P.vx));
      if(!ax&&Math.abs(P.vx)<1.4)P.vx=(P.vx?Math.sign(P.vx):P.dir)*1.4;
    }else P.vx=ax*2.6;
    if(ax)P.dir=ax;
  }
  // ジャンプは地面からだけ。続けて3回跳ぶと2秒間ジャンプ不可 (1.5秒跳ばなければ回数リセット)
  if(P.jlock>0)P.jlock--;
  if(++P.jt>90)P.jc=0;
  // 着地の少し前(0.2秒以内)に押したジャンプは覚えておいて、着地した瞬間に跳ぶ
  if(pressed.Space)P.jbuf=12;else if(P.jbuf>0)P.jbuf--;
  if(P.jbuf>0&&P.onG&&P.jlock<=0){
    P.vy=-16.5;P.jt=0;P.jbuf=0;
    if(++P.jc>=3){P.jc=0;P.jlock=120}
  }
  for(const cl of clouds)cl.x=wrap(cl.x+cl.vx);
  const pb=P.y+P.h;
  moveEnt(P,1);
  for(const cl of clouds)if(P.vy>=0&&pb<=cl.y+1&&P.y+P.h>=cl.y&&Math.abs(wdx(P.x+P.w/2,cl.x+cl.w/2))<(cl.w+P.w)/2){
    P.y=cl.y-P.h;P.vy=0;P.onG=1;P.x=wrap(P.x+cl.vx);
  }
  if(P.onG&&solid(Math.floor((P.x+P.w/2)/T),Math.floor((P.y+P.h)/T))&&Math.floor((P.y+P.h)/T)<best)best=Math.floor((P.y+P.h)/T);
  // 難易度3では上がってくる画面の下に消えたら即死
  if(P.y>cam+VH+10){if(hard){lives=0;state='over';return}if(hurt(1))return}
  for(const it of items)if(!it.got&&ov(P,it)){it.got=1;getItem(it.t)}
  if(P.pow>0)P.pow--;if(P.grip>0)P.grip--;if(P.curse>0)P.curse--;if(P.dbl>0)P.dbl--;
  // 敵を消すコマンドが切れたら、隠していた敵が2倍になって戻ってくる
  // 難易度3: 10秒無敵 → 5秒即死 をずっと繰り返す
  if(hard){const t=hardCyc++%900;P.cheat=0;
    if(t<600){P.star=600-t;P.curse=0}else{P.star=0;P.curse=900-t}}
  if(P.hide>0&&--P.hide==0){
    en=en.concat(P.stash);
    for(const e of P.stash){
      const c=Object.assign({},e,{dir:-e.dir});
      if(e.fly){c.t=e.t+Math.PI;c.x=wrap(e.x+WT/2)}
      else{const x=wrap(e.x+(e.dir>0?-T:T));if(solid(Math.floor((x+12)/T),Math.floor((e.y+e.h+1)/T)))c.x=x}
      en.push(c);
    }
    P.stash=[];P.dbl=120;
  }
  // コマンドの無敵が切れたら5秒間、敵に触れると即死
  if(P.star>0&&--P.star==0&&P.cheat){P.cheat=0;P.curse=300}
  cond.x=wrap(cond.x+1.6*cond.dir);if(frame%200==0)cond.dir*=-1;
  if(ov(P,cond)){score+=3000;state='clear';timer=150;return}
  if(pressed.KeyJ&&P.atk<=0)P.atk=18;
  if(P.atk>0){
    P.atk--;
    if(P.atk>=6&&P.atk<=12){
      // 攻撃力アップ中はハンマーの届く範囲が2倍
      const R=P.pow>0?56:28;
      const boxes=[{x:P.dir>0?P.x+P.w:P.x-R,y:P.y-4,w:R,h:P.h+4}];
      if(!P.onG)boxes.push({x:P.x-6,y:P.y-R-2,w:P.w+12,h:R+2});
      for(const b of boxes){
        for(const e of en)if(!e.dead&&ov(b,e)){e.dead=1;score+=100;
          for(let i=0;i<10;i++)parts.push({x:e.x+12,y:e.y+10,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:30,c:'#ff5050'})}
        for(let r=Math.floor(b.y/T);r<=Math.floor((b.y+b.h-1)/T);r++)
          for(let c=Math.floor(b.x/T);c<=Math.floor((b.x+b.w-1)/T);c++)
            if(solid(c,r)==2)breakTile(c,r);
      }
    }
  }
  if(P.inv>0)P.inv--;if(P.hurtT>0)P.hurtT--;
  const sp=STG[stage].s;
  for(const e of en){
    if(e.dead)continue;
    if(e.fly){e.t+=.04;e.x=wrap(e.x+e.dir*(1+stage*.3));e.y=e.by+Math.sin(e.t)*50}
    else{
      e.vx=e.dir*sp;
      if(moveEnt(e,0))e.dir*=-1;
      else if(e.onG){
        // 穴を見つけたら氷を運んで埋める
        const fc=Math.floor((e.dir>0?e.x+e.w+1:e.x-1)/T),fr=Math.floor((e.y+e.h+1)/T);
        if(!solid(fc,fr)){
          if(e.cd<=0&&!ov(P,{x:wrap(fc*T),y:fr*T,w:T,h:T})){map[fr][(fc%W+W)%W]=2;e.cd=90}
          else e.dir*=-1;
        }
      }
      if(e.cd>0)e.cd--;
    }
    // 無敵中は触れた敵を倒す
    if(P.star>0&&ov(P,e)){e.dead=1;score+=100;
      for(let i=0;i<10;i++)parts.push({x:e.x+12,y:e.y+10,vx:(Math.random()-.5)*5,vy:-Math.random()*4,l:30,c:'#ffd23a'})}
    else if(P.curse>0&&ov(P,e)){lives=0;state='over';return}
    else if(P.inv<=0&&ov(P,e)){P.x+=P.x<e.x?-6:6;if(hurt(0))return}
  }
  en=en.filter(e=>!e.dead);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.l--}
  parts=parts.filter(p=>p.l>0);
  // 新しい階に着地したときだけ上にスクロール
  const tgt=Math.max(0,Math.min(H*T-VH,best*T-VH+5.5*T));
  // 難易度3: 画面がすごくゆっくり自動で上がっていく (自分で登ればそこから続きを上がる)
  if(hard){autoCam=Math.max(0,Math.min(autoCam-.25,tgt));cam+=(autoCam-cam)*.08}
  else{autoCam=cam;cam+=(tgt-cam)*.08}
}
function hurt(fall){
  lives--;P.inv=fall?120:90;if(!fall)P.hurtT=24;
  if(lives<=0){state='over';return 1}
  if(fall){
    let c=7;while(!map[best][c])c=(c+1)%W;
    P.x=c*T+6;P.y=best*T-30;P.vx=P.vy=0;
  }else P.vy=-6;
}

function r(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
// 描画用の小さな道具
function el(x,y,rx,ry,c){X.fillStyle=c;X.beginPath();X.ellipse(x,y,rx,ry,0,0,Math.PI*2);X.fill()}
function poly(p,c){X.fillStyle=c;X.beginPath();X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.closePath();X.fill()}
function rr(x,y,w,h,k,c){X.fillStyle=c;X.beginPath();X.moveTo(x+k,y);X.arcTo(x+w,y,x+w,y+h,k);X.arcTo(x+w,y+h,x,y+h,k);X.arcTo(x,y+h,x,y,k);X.arcTo(x,y,x+w,y,k);X.fill()}
function lg(x0,y0,x1,y1,s){const g=X.createLinearGradient(x0,y0,x1,y1);for(const [o,c] of s)g.addColorStop(o,c);return g}
function rg(x,y,r0,r1,s){const g=X.createRadialGradient(x,y,r0,x,y,r1);for(const [o,c] of s)g.addColorStop(o,c);return g}
function line(p,c,w){X.strokeStyle=c;X.lineWidth=w;X.lineCap='round';X.beginPath();X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.stroke()}

// ===== ドット絵 =====
// 文字の地図からドット絵を作る ('.' は透明)
function pix(rows,pal){
  const w=Math.max(...rows.map(s=>s.length)),c=document.createElement('canvas');c.width=w;c.height=rows.length;
  const g=c.getContext('2d');
  rows.forEach((s,y)=>{for(let x=0;x<s.length;x++){const k=s[x];if(k!='.'&&pal[k]){g.fillStyle=pal[k];g.fillRect(x,y,1,1)}}});
  return c;
}
// u: ドット1つの大きさ。ブロックと背景は2、キャラとアイテムは主人公の画像に合わせて1.5
const UT=2,US=1.5;
function blit(im,x,y,u,dir){
  X.imageSmoothingEnabled=false;
  if(dir<0){X.save();X.translate(x+im.width*u,y);X.scale(-1,1);X.drawImage(im,0,0,im.width*u,im.height*u);X.restore()}
  else X.drawImage(im,x,y,im.width*u,im.height*u);
}
const PAL={k:'#000000',w:'#fcfcfc',c:'#a4e4fc',b:'#3cbcfc',B:'#0058f8',n:'#0000bc',
  l:'#fca044',o:'#c84c0c',d:'#881400',m:'#3c0800',r:'#f83800',R:'#a81000',y:'#f8b800',Y:'#fcfc00',
  g:'#58d854',G:'#00a800',p:'#d800cc',P:'#7c007c',v:'#f878f8',s:'#bcbcbc',h:'#f8a4c0',H:'#e40058'};
const ICE=[
  "wwwwwwwwwwwwwwwc",
  "wcccccccccccccbB",
  "wcwwwcccccccccbB",
  "wcwwccccccccccbB",
  "wcwccccccccwccbB",
  "wcccccccccwcccbB",
  "wcccccccccwcccbB",
  "wccccccccwccccbB",
  "wcccccccwcccccbB",
  "wccccccccccccbbB",
  "wcccccccccccccbB",
  "wccccccccccwccbB",
  "wcccccccccwcccbB",
  "wcbccccccccccbbB",
  "wbbbbbbbbbbbbbbB",
  "cBBBBBBBBBBBBBBB"];
const ICE_SP=ICE.map((s,y)=>y==3?"wcwwccwcccccccbB":y==4?"wcwcwwwwwccwccbB":y==5?"wcccccwccccwccbB":s);
// レンガ: 1段8ドット、下の段は半分ずらす
const BRICK_ROW=["lllllldm","looooodm","looooodm","looooodm","looooodm","looooodm","dddddddm","mmmmmmmm"];
const ROCK=[...BRICK_ROW.map(s=>s+s),...BRICK_ROW.map(s=>{s=s+s;return s.slice(4)+s.slice(0,4)})];
const SNOW=["wwwwwwwwwwwwwwww","wwwwwwwwwwwwwwww","cwwwwccwwwwwwcww",".cw..c...wc..c.w","..........c....."];
const ROCK_TOP=ROCK.map((s,y)=>{const o=SNOW[y];if(!o)return s;let t='';for(let i=0;i<16;i++)t+=o[i]=='.'?s[i]:o[i];return t});

const ENEMY_A=[
  "...y.......y....",
  "...yy.fff.yy....",
  "....yfffffy.....",
  "..fffffffffff...",
  ".fffwwffffwwff..",
  ".ffwkrfffwkrfF..",
  ".fffwwffffwwfF..",
  ".ffffffffffffFF.",
  ".ffkkkkkkkkkfFF.",
  ".ffkwkkwkkwkfFF.",
  ".fffffffffffFFF.",
  "..FffffffffFFF..",
  "..kkkk...kkkk...",
  ".kwwwk..kwwwk..."];
const ENEMY_B=ENEMY_A.slice(0,12).concat([
  "...kkkk.kkkk....",
  "..kwwwk.kwwwk..."]);

let TILES,CLOUD,STARS,ENEMY,BIRD,CONDOR,ITEM,ITEM_STAR2,BGC,BGX;
function initArt(){
  TILES={ice:pix(ICE,PAL),ice2:pix(ICE_SP,PAL),rock:pix(ROCK,PAL),rockTop:pix(ROCK_TOP,PAL)};
  ENEMY=ECOLP.map(cp=>{const p=Object.assign({},PAL,cp);return [pix(ENEMY_A,p),pix(ENEMY_B,p)]});
  BIRD=[pix(BIRD_A,BIRDP),pix(BIRD_B,BIRDP)];
  CONDOR=[pix(CONDOR_A,PAL),pix(CONDOR_B,PAL)];
  CLOUD=pix(CLOUD_MAP,PAL);
  ITEM={};for(const k in ITEM_MAP)ITEM[k]=pix(ITEM_MAP[k],PAL);
  ITEM_STAR2=pix(ITEM_MAP.star,Object.assign({},PAL,{y:'#fcfc9c',o:'#f8b800'}));
  STARS=[];for(let i=0;i<60;i++)STARS.push({x:Math.random()*VW/UT|0,y:Math.random()*VH*.7/UT|0,t:Math.random()*6});
  // 背景は半分の解像度で描いて、ドットのまま拡大する
  BGC=document.createElement('canvas');BGC.width=VW/UT;BGC.height=VH/UT;BGX=BGC.getContext('2d');
}
// 山の高さ (ドット単位)
function peak(x,list){let h=-1e9;for(const [px,ph] of list)h=Math.max(h,ph-Math.abs(x-px)*1.1);return h}
function drawBG(){
  const g=BGX,w=BGC.width,h=BGC.height;
  g.fillStyle='#000';g.fillRect(0,0,w,h);
  for(const s of STARS){const a=Math.sin(frame/40+s.t);if(a>-.3){g.fillStyle=a>.6?'#fcfcfc':'#3cbcfc';g.fillRect(s.x,s.y,1,1)}}
  const off=((cam||0)*.15)%160/UT;
  for(const [k,sp,col,shade] of [[0,.2,'#0000a8','#0000bc'],[1,.3,'#0058f8','#0078f8']]){
    const base=h+off*sp-(k?10:28),list=[];
    for(let i=-1;i<5;i++)list.push([i*65+(k?0:32),k?44:56]);
    for(let x=0;x<w;x++){
      const ph=peak(x,list);if(ph<=0)continue;
      const top=Math.round(base-ph-(k?0:4));
      g.fillStyle=col;g.fillRect(x,top,1,h-top);
      // 山の右側に影、てっぺんに雪
      let near=list.reduce((a,b)=>Math.abs(b[0]-x)<Math.abs(a[0]-x)?b:a);
      if(x>near[0]){g.fillStyle=shade;g.fillRect(x,top+2,1,h-top)}
      const snow=near[1]-Math.abs(x-near[0])*1.1>near[1]-14?Math.max(0,14-Math.abs(x-near[0])*1.1+((x*7)%3)):0;
      if(snow>0){g.fillStyle=x>near[0]?'#a4e4fc':'#fcfcfc';g.fillRect(x,top,1,snow)}
    }
  }
  for(const f of flakes){f.y+=f.s;f.x+=Math.sin(frame/40+f.s*9)*.4;if(f.y>VH)f.y=0;
    g.fillStyle=f.s>1?'#fcfcfc':'#a4e4fc';g.fillRect(Math.round(f.x/UT),Math.round(f.y/UT),1,1)}
  X.imageSmoothingEnabled=false;X.drawImage(BGC,0,0,VW,VH);
}
function drawTile(t,x,y,top,v,sp){
  blit(t==2?(sp?TILES.ice2:TILES.ice):(top?TILES.rockTop:TILES.rock),x,y,UT);
}
// 主人公とハンマーの画像 (images/氷の冒険者とハンマーの8ビット素材集.png から切り出したもの)
// [幅, 高さ, 体の中心x] 単位は元画像のピクセル。どの絵も右向き
const SPM={walk0:[151,226,53],walk1:[167,226,67],walk2:[169,228,65],walk3:[161,229,62],walk4:[169,232,69],walk5:[158,228,58],
  jump:[176,271,64],atk0:[218,352,63],atk1:[279,329,68],atk2:[379,301,92],atk3:[323,318,84],
  crouch0:[200,203,92],crouch1:[216,191,99],down:[305,141,137],hammer0:[150,174,75],hammer1:[187,185,93]};
const SPR={};for(const n in SPM){SPR[n]=new Image();SPR[n].src='images/sprites/'+n+'.png'}
const SPK=34/226;
function playerFrame(){
  if(P.hurtT>0)return 'down';
  if(P.atk>0){if(P.atk>12)return 'atk0';if(!P.onG)return 'atk3';return P.atk>=6?'atk2':'atk1'}
  if(!P.onG)return 'jump';
  if(Math.abs(P.vx)>.1)return 'walk'+(1+(frame/5|0)%5);
  if(P.jlock>0)return 'crouch0';
  return 'walk0';
}
// x:体の中心 y:足元 に画像を描く
function drawSpr(n,x,y,dir,k){
  const [w,h,ax]=SPM[n],im=SPR[n];if(!im.complete||!im.naturalWidth)return;
  X.save();X.translate(x,y);X.scale(dir,1);X.imageSmoothingQuality='high';
  X.drawImage(im,-ax*k,-h*k,w*k,h*k);X.restore();
}
function drawPlayer(){
  if(P.inv>0&&P.hurtT<=0&&frame%6<3)return;
  const x=Math.round(P.x+P.w/2),y=Math.round(P.y+P.h-cam);
  X.save();
  // 無敵中は虹色、パワーハンマー中は金色に光る
  if(P.star>0){X.filter='hue-rotate('+(frame*12%360)+'deg) saturate(1.6)';X.shadowColor='hsl('+(frame*12%360)+',100%,60%)';X.shadowBlur=14}
  else if(P.pow>0){X.shadowColor='#ffcc30';X.shadowBlur=10+Math.sin(frame/5)*4}
  drawSpr(playerFrame(),x,y,P.dir,P.pow>0&&P.atk>0?SPK*1.15:SPK);
  X.restore();
  if(P.grip>0)for(let i=-2;i<=2;i++)r(x+i*4-1,y,2,3,'#bcbcbc');
}
function drawBird(e){
  const f=(frame/6|0)%2;
  blit(BIRD[f],Math.round(e.x),Math.round(e.y-cam),US,e.dir);
}
function drawEnemy(e){
  if(e.fly)return drawBird(e);
  const b=(frame/8|0)%2;
  blit(ENEMY[stage][b],Math.round(e.x),Math.round(e.y-cam+1),US,e.dir);
}
function drawCondor(){
  const f=(frame/8|0)%2;
  blit(CONDOR[f],Math.round(cond.x),Math.round(cond.y-cam),US,cond.dir);
}
function drawItem(t,x,y){
  if(t!='nasu')y+=(frame/12+x|0)%2?-1:1;
  if(t=='pow'){X.save();X.shadowColor='#ffcc30';X.shadowBlur=8;drawSpr('hammer1',x+8,y+20,1,20/185);X.restore();return}
  blit(t=='star'&&frame%20<10?ITEM_STAR2:ITEM[t],Math.round(x),Math.round(y),US);
}
function txt(s,x,y,sz,c){X.font='bold '+sz+'px monospace';X.textAlign='center';X.fillStyle='#000';X.fillText(s,x+2,y+2);X.fillStyle=c||'#fff';X.fillText(s,x,y)}
// ドット絵風の枠 (白い縁 + 黒い影)
function pixBox(x,y,w,h,c){r(x+4,y+4,w,h,'#000');r(x,y,w,h,'#fcfcfc');r(x+2,y+2,w-4,h-4,c);r(x+2,y+h-4,w-4,2,'rgba(0,0,0,.35)')}
// 難易度コマンド表
function drawCmdTable(){
  r(0,0,VW,VH,'rgba(0,0,10,.75)');

  txt('難易度コマンド表',VW/2,128,24,'#ffd23a');
  const L=(s,x,y,sz,c,al)=>{X.font='bold '+sz+'px sans-serif';X.textAlign=al||'left';X.fillStyle=c||'#fff';X.fillText(s,x,y)};
  r(60,148,VW-120,1.5,'#8fc0ff');
  L('コマンド',70,170,13,'#8fc0ff');L('難易度',255,170,13,'#8fc0ff');L('内容',315,170,13,'#8fc0ff');
  r(60,180,VW-120,1,'rgba(143,192,255,.4)');
  L('→ ↓ ← ↑ → ↓ ← ↑',70,206,17);L('3',268,206,17,'#ff5050');
  L('10秒無敵と',315,196,12);L('5秒即死を繰り返す',315,210,12);L('画面が自動で上昇',315,224,12,'#ffb070');L('画面外に出たら即死',315,238,12,'#ff5050');
  r(60,250,VW-120,1,'rgba(143,192,255,.4)');
  L('・矢印キーか WASD で入力 (タイトルでもゲーム中でもOK)',70,276,12);
  L('・もう一度同じコマンドを打つと元に戻る',70,300,13);
  L('現在の難易度: ',70,332,15);L(hard?'3':'ふつう',190,332,15,hard?'#ff5050':'#7cf0a0');
  if(frame%60<40)L('クリック / ENTER で閉じる',VW/2,372,13,'#c8f8ff','center');
}
function draw(){
  X.setTransform(S,0,0,S,0,0);
  drawBG();
  if(state=='title'){
    txt('FROST PEAK',VW/2,150,42,'#5ce1ff');txt('CLIMBER',VW/2,195,42,'#ffd23a');
    txt('A/D・←→ : 移動',VW/2,270,16);txt('SPACE : ジャンプ',VW/2,295,16);txt('J : ハンマー',VW/2,320,16);
    txt('頂上の大鳥につかまれ!',VW/2,355,16,'#c8f8ff');
    if(frame%60<40)txt('PRESS ENTER',VW/2,410,22,'#ffd23a');
    if(hard)txt('難易度 3',VW-50,52,16,'#ff5050');
    pixBox(BTN.x,BTN.y,BTN.w,BTN.h,'#0058f8');
    txt('難易度コマンド',VW/2,BTN.y+20,15);
    if(showCmd)drawCmdTable();
    return;
  }
  const r0=Math.max(0,Math.floor(cam/T)),r1=Math.min(H-1,Math.floor((cam+VH)/T));
  for(let rr=r0;rr<=r1;rr++)for(let c=0;c<W;c++){const t=map[rr][c];if(t)drawTile(t,c*T,Math.round(rr*T-cam),!solid(c,rr-1),(c+rr)&1,(c*7+rr*3)%11==0)}
  for(const cl of clouds)for(const dx of [0,-WT])blit(CLOUD,Math.round(cl.x+dx),Math.round(cl.y-cam-8),UT);
  for(const it of items)if(!it.got)drawItem(it.t,it.x,it.y-cam);
  drawCondor();
  for(const e of en)drawEnemy(e);
  drawPlayer();
  for(const p of parts)if(p.l>8||frame%4<2)r(Math.round(p.x/UT)*UT-UT,Math.round((p.y-cam)/UT)*UT-UT,UT*2,UT*2,p.c);
  r(0,0,VW,26,'rgba(0,0,0,.6)');
  X.font='bold 16px monospace';X.textAlign='left';X.fillStyle='#fff';
  X.fillText('STAGE '+(stage+1)+'/3',8,19);if(hard){X.fillStyle='#ff5050';X.fillText('難3',105,19);X.fillStyle='#fff'}X.fillText('SCORE '+score,150,19);
  X.fillStyle='#ff4060';X.fillText('♥'.repeat(Math.max(0,lives)),400,19);
  // 効果中のアイテムと残り秒数
  {let bx=8;for(const [t,v] of [['pow',P.pow],['star',P.star],['grip',P.grip]])if(v>0){
    drawItem(t,bx,32);X.font='bold 14px monospace';X.textAlign='left';X.fillStyle='#fff';X.fillText(Math.ceil(v/60),bx+20,48);bx+=48}}
  if(P.jlock>0)txt('ジャンプ不可 '+Math.ceil(P.jlock/60)+'秒',VW/2,60,18,'#ff8080');
  if(P.hide>0)txt('敵が消えた… '+Math.ceil(P.hide/60)+'秒',VW/2,108,18,'#80d0ff');
  if(P.dbl>0&&frame%16<11)txt('敵が2倍になって戻ってきた!',VW/2,108,20,'#ff5050');
  if(P.curse>0&&frame%20<14)txt('☠ 敵に触れると即死 '+Math.ceil(P.curse/60)+'秒',VW/2,84,18,'#c060ff');
  if(state=='clear')txt('STAGE CLEAR!',VW/2,220,36,'#ffd23a');
  if(state=='over'){r(0,0,VW,VH,'rgba(0,0,0,.5)');txt('GAME OVER',VW/2,210,44,'#ff4060');txt('SCORE '+score,VW/2,260,20);if(frame%60<40)txt('ENTER でリトライ',VW/2,320,20)}
  if(state=='win'){r(0,0,VW,VH,'rgba(0,0,0,.4)');txt('GAME CLEAR!',VW/2,200,44,'#ffd23a');txt('全ステージ制覇!',VW/2,245,20);txt('SCORE '+score,VW/2,280,20);if(frame%60<40)txt('ENTER でもう一度',VW/2,340,20)}
}

let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();for(const k in pressed)delete pressed[k];acc-=1000/60}
  draw();requestAnimationFrame(loop);
}
initArt();
requestAnimationFrame(loop);
